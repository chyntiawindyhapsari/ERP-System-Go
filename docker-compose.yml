services:
  postgres:
    image: postgres:16-alpine
    container_name: first-project-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: first_project
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d first_project"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Opsional: otomasi (n8n) ---
  # Jalankan dengan: docker compose --profile automation up -d
  n8n:
    image: n8nio/n8n:latest
    container_name: first-project-n8n
    profiles: ["automation"]
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: Asia/Jakarta
      TZ: Asia/Jakarta
      N8N_SECURE_COOKIE: "false"       # karena diakses lewat http://localhost
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      APP_URL: http://host.docker.internal:8080
      INTEGRATION_API_KEY: ${INTEGRATION_API_KEY}
      OWNER_WA: ${OWNER_WA:-6281234567890}
      FONNTE_TOKEN: ${FONNTE_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8ndata:/home/node/.n8n


volumes:
  pgdata:
  n8ndata:
